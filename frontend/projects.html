<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo-v2.jpg">
  <title>My projects — DocNexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family:'DM Sans',sans-serif; }
    .font-syne { font-family:'Syne',sans-serif; }
    .bg-grid { background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size:40px 40px; }
  </style>
  <script src="js/auth.js"></script>
</head>
<body class="bg-[#0a0a0f] text-white min-h-screen relative">
  <div class="bg-grid fixed inset-0 pointer-events-none"></div>
  <div class="relative z-10">
    <nav class="flex items-center justify-between px-6 md:px-10 py-4 border-b border-white/5 sticky top-0 bg-[#0a0a0f]/85 backdrop-blur-xl z-[100]">
      <a href="projects.html" class="flex items-center gap-2.5 hover:opacity-80 transition-opacity">
        <img src="assets/logo-v2.jpg" alt="DocNexus" class="h-9 w-9 rounded-lg bg-white object-cover">
        <span class="font-syne text-[17px] font-extrabold tracking-tight">Doc<span class="text-[#a78bfa]">Nexus</span></span>
      </a>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-[12px] font-semibold bg-gradient-to-r from-[#7c6fff] to-[#a78bfa] px-3.5 py-1.5 rounded-lg hover:opacity-90">+ New fusion</a>
        <div id="userBox" class="flex items-center gap-2"></div>
      </div>
    </nav>

    <div class="max-w-[900px] mx-auto px-6 py-10">
      <div class="text-[11px] text-zinc-600 font-bold uppercase tracking-widest mb-2">Saved to your account</div>
      <h1 class="font-syne text-2xl font-extrabold text-zinc-100 mb-8">My projects</h1>
      <div id="list" class="space-y-3"><div class="animate-pulse space-y-3"><div class="h-[92px] rounded-2xl bg-white/[0.03] border border-white/[0.05]"></div><div class="h-[92px] rounded-2xl bg-white/[0.03] border border-white/[0.05]"></div></div></div>
    </div>
  </div>

  <script>
    const IS_LOCAL_DEV = !location.protocol.startsWith('http') ||
      (['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '5000');
    const API_BASE = window.DOCNEXUS_API ||
      (IS_LOCAL_DEV ? 'http://localhost:5000/api/projects' : `${location.origin}/api/projects`);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function load() {
      const box = document.getElementById('list');
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error('Could not load your projects');
        const { projects } = await res.json();
        if (!projects.length) {
          box.innerHTML = `<div class="text-center py-16 border border-dashed border-white/10 rounded-2xl">
            <div class="text-zinc-400 mb-4">No projects yet.</div>
            <a href="index.html" class="text-[13px] font-semibold bg-gradient-to-r from-[#7c6fff] to-[#a78bfa] px-4 py-2 rounded-lg">Create your first fusion</a></div>`;
          return;
        }
        box.innerHTML = projects.map(card).join('');
      } catch (e) {
        box.innerHTML = `<div class="text-red-400 text-sm py-10 text-center">${esc(e.message === 'Failed to fetch' ? "Can't reach the backend. Is it running (npm run dev)?" : e.message)}</div>`;
      }
    }

    function card(p) {
      const d = new Date(p.createdAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      const ready = p.status === 'ready';
      const chip = ready ? ['Ready', 'text-[#34d399] bg-[#34d399]/10'] : p.status === 'failed' ? ['Failed', 'text-red-400 bg-red-500/10'] : [`Processing ${p.progress && p.progress.pct != null ? p.progress.pct + '%' : ''}`, 'text-amber-400 bg-amber-500/10'];
      const mats = p.files.filter(f => f.type === 'material').map(f => f.name);
      const qps = p.files.filter(f => f.type === 'question_paper').length;
      return `<div class="bg-white/[0.03] border border-white/[0.06] rounded-2xl p-5 flex flex-col md:flex-row md:items-center gap-4" id="p-${p.id}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${chip[1]}">${esc(chip[0])}</span>
            <span class="text-[11px] text-zinc-600">${esc(d)}</span>
          </div>
          <div class="text-[15px] font-semibold text-zinc-100 truncate">${esc(p.title)}</div>
          <div class="text-[12px] text-zinc-500 mt-1 truncate">${esc(mats.join(' · '))}${qps ? ` · ${qps} question paper${qps > 1 ? 's' : ''}` : ''}</div>
          ${ready ? `<div class="text-[12px] text-zinc-600 mt-1">${p.stats.topicsMerged} topics · ${p.stats.duplicatesRemoved} duplicates removed · ${p.stats.conflictsFound} conflicts</div>` : ''}
        </div>
        <div class="flex items-center gap-2 shrink-0">
          ${ready ? `<button onclick="openProject('${p.id}')" class="text-[12px] font-semibold bg-gradient-to-r from-[#7c6fff] to-[#a78bfa] px-3.5 py-2 rounded-lg hover:opacity-90">Open</button>
          <button onclick="downloadPdf('${p.id}', this)" class="text-[12px] text-zinc-300 border border-white/10 px-3 py-2 rounded-lg hover:bg-white/5">PDF</button>` : ''}
          <button onclick="removeProject('${p.id}', this)" class="text-[12px] text-zinc-500 hover:text-red-400 border border-white/10 px-3 py-2 rounded-lg">Delete</button>
        </div>
      </div>`;
    }

    function openProject(id) {
      sessionStorage.setItem('docnexus_project_id', id);
      location.href = 'results.html?id=' + id;
    }

    async function downloadPdf(id, btn) {
      const old = btn.textContent; btn.textContent = '…'; btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/${id}/export/notes`);
        if (!res.ok) throw new Error('PDF unavailable');
        const url = URL.createObjectURL(await res.blob());
        const a = document.createElement('a'); a.href = url; a.download = 'DocNexus-Unified-Notes.pdf'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } catch (e) { alert(e.message); }
      btn.textContent = old; btn.disabled = false;
    }

    async function removeProject(id, btn) {
      if (!confirm('Delete this project and all its notes? This cannot be undone.')) return;
      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        document.getElementById('p-' + id).remove();
        if (!document.querySelector('[id^="p-"]')) load();
      } catch (e) { alert(e.message); btn.disabled = false; }
    }

    if (DocAuth.require()) {
      DocAuth.mount(document.getElementById('userBox'));
      load();
    }
  </script>
</body>
</html>
